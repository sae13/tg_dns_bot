name: Deploy tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      WORKER_CLOUDFLARE_API_TOKEN: ${{ secrets.WORKER_CLOUDFLARE_API_TOKEN }}
      ALLOWED_ZONE_MAP: ${{ vars.WORKER_ALLOWED_ZONE_MAP }}
      SEND_ENABLED: ${{ vars.SEND_ENABLED }}
      READ_ENABLED: ${{ vars.READ_ENABLED }}
      HELP_ENABLED: ${{ vars.HELP_ENABLED }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.19.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type checking
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Validate deployment bundle
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker and synchronize secrets and variables
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.34.0'
          secrets: |
            BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET
          vars: |
            ALLOWED_ZONE_MAP
            SEND_ENABLED
            READ_ENABLED
            HELP_ENABLED
          command: deploy

      - name: Bind the Worker Cloudflare credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$WORKER_CLOUDFLARE_API_TOKEN" | npx wrangler secret put CLOUDFLARE_API_TOKEN
          npx wrangler secret list --format json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const names = JSON.parse(input).map((entry) => entry.name);
              for (const required of ["BOT_TOKEN", "TELEGRAM_WEBHOOK_SECRET", "CLOUDFLARE_API_TOKEN"]) {
                if (!names.includes(required)) process.exit(1);
              }
            });
          '

      - name: Verify deployment health
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          HEALTH_URL="${DEPLOYMENT_URL%/}/health"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$HEALTH_URL" >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 3
          done

      - name: Register and verify Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_WEBHOOK_URL: ${{ steps.deploy.outputs.deployment-url }}/webhook
        run: npm run set-webhook
